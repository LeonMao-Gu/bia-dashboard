<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>体成分趋势 · Body Composition</title>
<style>
/* ============================================================
   Design tokens — Apple-style neutrals + materials
   ============================================================ */
:root{
  --bg:#EFEFF4; --bg2:#F7F7FA; --card:#FFFFFF;
  --label:#1D1D1F; --label-2:#3C3C43; --label-3:#6E6E73; --label-4:#A1A1A8;
  --sep:rgba(60,60,67,.12); --sep-2:rgba(60,60,67,.2); --fill:rgba(118,118,128,.10); --fill-2:rgba(118,118,128,.16);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.78);
  --blue:#0A84FF; --green:#30A46C; --green-t:#1E8E50; --red-t:#D70015;
  --fat:#F0662E; --muscle:#1E9E62; --gold:#C08A1E; --water:#0E9CC4; --slate:#6B7A8F; --plum:#9A6FB0; --moss:#7E8F35; --brown:#A0703F;
  --r-card:22px; --r-ctl:13px;
  --shadow-s:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.03);
  --shadow-m:0 2px 6px rgba(0,0,0,.04),0 12px 30px -14px rgba(0,0,0,.18);
  --shadow-pop:0 8px 20px -6px rgba(0,0,0,.16),0 24px 60px -18px rgba(0,0,0,.34);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
 :root{--bg:#000000;--bg2:#0C0C0E;--card:#1C1C1E;--label:#F5F5F7;--label-2:#D6D6DA;--label-3:#98989F;--label-4:#68686E;
   --sep:rgba(255,255,255,.12);--sep-2:rgba(255,255,255,.2);--fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);
   --glass:rgba(30,30,33,.62);--glass-strong:rgba(30,30,33,.8);
   --blue:#0A84FF;--green:#32D583;--green-t:#3DDC84;--red-t:#FF6961;
   --fat:#FF8A57;--muscle:#3DD68C;--gold:#E3B448;--water:#40C4E8;--slate:#93A2B5;--plum:#C08FD6;--moss:#AEBE55;--brown:#C68F5E;
   --shadow-s:0 1px 2px rgba(0,0,0,.5);--shadow-m:0 2px 6px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7);
   --shadow-pop:0 10px 24px -6px rgba(0,0,0,.6),0 30px 70px -18px rgba(0,0,0,.8);}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:
   radial-gradient(120% 60% at 100% 0,rgba(10,132,255,.05),transparent 60%),
   radial-gradient(90% 50% at 0 0,rgba(30,158,98,.05),transparent 55%),
   var(--bg);
  color:var(--label);font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.page{max-width:1100px;margin:0 auto;padding:0 20px calc(80px + env(safe-area-inset-bottom))}

/* ---------- translucent sticky header ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--sep)}
.tbin{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto;padding:11px 20px}
.topbar .t{font-size:16px;font-weight:640;letter-spacing:-.02em}
.topbar .g{font-size:13px;color:var(--label-3);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.topbar .g b{color:var(--fat);font-weight:600}
@media(max-width:520px){.topbar .g span.hideS{display:none}}

/* ---------- hero ---------- */
header.hero{padding:34px 0 6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--label-4)}
h1{font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.02;margin-top:8px}

/* ---------- summary strip ---------- */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.sblk{padding:15px 16px}
.sblk .l{font-size:12px;font-weight:500;color:var(--label-3)}
.sblk .m{font-size:clamp(17px,2.4vw,20px);font-weight:640;margin-top:7px;letter-spacing:-.02em;line-height:1.05}
.sblk .s{font-size:12.5px;margin-top:3px;color:var(--label-4);font-weight:500}

/* ---------- section head ---------- */
.sec{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:42px 0 15px}
.sec .e{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--label-4);margin-bottom:6px}
.sec h2{font-size:23px;font-weight:680;letter-spacing:-.02em}
.sec p{font-size:13px;color:var(--label-3);margin-top:5px;max-width:560px}

/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--sep);border-radius:var(--r-card);box-shadow:var(--shadow-m)}
.pad{padding:22px}
@media(max-width:600px){.pad{padding:17px}}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.stat{padding:16px 15px}
.stat .lab{font-size:12.5px;font-weight:520;color:var(--label-3);display:flex;align-items:center;gap:6px}
.stat .lab .sw{width:8px;height:8px;border-radius:3px}
.stat .val{font-size:29px;font-weight:660;letter-spacing:-.03em;margin-top:9px;line-height:1}
.stat .val u{font-size:13px;font-weight:520;color:var(--label-3);text-decoration:none;margin-left:2px;letter-spacing:0}
.stat .delta{font-size:12.5px;font-weight:560;margin-top:5px}
.stat .delta s{color:var(--label-4);font-weight:400;text-decoration:none}
.stat .spark{margin-top:11px;height:30px}
.stat .rng{font-size:11px;color:var(--label-4);margin-top:8px}

/* ---------- glass segmented ---------- */
.segmented{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;backdrop-filter:blur(8px)}
.segmented button{font-size:13px;font-weight:540;padding:7px 15px;border:none;background:transparent;color:var(--label-2);
  border-radius:9px;cursor:pointer;line-height:1.2;display:inline-flex;align-items:center;gap:6px;
  transition:transform .12s ease,color .2s,background .2s,box-shadow .2s}
.segmented button.on{background:var(--card);color:var(--label);box-shadow:var(--shadow-s);font-weight:600}
.segmented button:active{transform:scale(.93)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font-size:13px;font-weight:520;padding:7px 13px;border-radius:100px;border:none;background:var(--fill);color:var(--label-2);
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1;
  transition:transform .12s cubic-bezier(.2,.7,.2,1),background .2s,color .2s}
.chip .sw{width:8px;height:8px;border-radius:3px;background:currentColor;opacity:.5;transition:.2s}
.chip .u{opacity:.5;font-size:11px}
.chip:hover{background:var(--fill-2)}
.chip:active{transform:scale(.92)}
.chip.on{color:#fff}.chip.on .sw{opacity:1;background:#fff}
.chip:disabled{opacity:.38;cursor:not-allowed}

/* ---------- chart ---------- */
.charthost{position:relative;width:100%}
.cbox{position:relative}
.yaxis,.raxis{position:absolute;top:0;height:100%;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,var(--card) 72%,transparent)}
.raxis{right:0;background:linear-gradient(270deg,var(--card) 72%,transparent)}
.yaxis{left:0}
.yaxis svg,.raxis svg{display:block;overflow:visible}
.cscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 8px),transparent);
  mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 8px),transparent)}
.cscroll svg{display:block;overflow:visible;transition:opacity .28s ease}
.cscroll::-webkit-scrollbar{height:7px}
.cscroll::-webkit-scrollbar-thumb{background:var(--sep-2);border-radius:4px}
.cscroll::-webkit-scrollbar-track{background:transparent}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px;flex-wrap:wrap}
.axhint{font-size:12px;font-weight:520;color:var(--label-3)}
.hint{font-size:11.5px;color:var(--label-4);display:flex;align-items:center;gap:6px}
.scrollcue{font-size:11px;color:var(--label-4);display:flex;align-items:center;gap:5px;margin-top:7px}
.tip{position:fixed;pointer-events:none;background:var(--glass-strong);backdrop-filter:blur(18px) saturate(180%);
  color:var(--label);font-size:12.5px;padding:9px 12px;border-radius:12px;font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .14s;white-space:nowrap;z-index:60;box-shadow:var(--shadow-pop);border:1px solid var(--sep);font-weight:520}
.tip b{font-weight:680}
.leg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:15px}
.leg span{font-size:12.5px;color:var(--label-3);display:flex;align-items:center;gap:7px;font-weight:500}
.leg i{width:15px;height:3px;border-radius:2px;display:inline-block}

/* ---------- single-day ---------- */
.daypick{position:relative;display:flex;align-items:center;gap:7px}
.daynav,.daybtn{border:1px solid var(--sep);background:var(--fill);color:var(--label);cursor:pointer;
  transition:transform .12s cubic-bezier(.2,.7,.2,1),background .2s}
.daynav{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--label-2)}
.daynav:hover:not(:disabled){background:var(--fill-2)}
.daynav:active:not(:disabled){transform:scale(.9)}
.daynav:disabled{opacity:.32;cursor:not-allowed}
.daybtn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:560;padding:8px 14px;border-radius:11px;font-variant-numeric:tabular-nums}
.daybtn:hover{background:var(--fill-2)}
.daybtn:active{transform:scale(.97)}
.daybtn .chev{color:var(--label-4)}
.calpop{position:absolute;top:calc(100% + 10px);right:0;width:280px;z-index:50;padding:15px;
  background:var(--glass-strong);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--sep-2);border-radius:20px;box-shadow:var(--shadow-pop);
  transform-origin:top right;opacity:0;transform:scale(.9) translateY(-6px);pointer-events:none;filter:blur(4px)}
.calpop.show{opacity:1;transform:none;pointer-events:auto;filter:blur(0)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.calhead .m{font-size:15px;font-weight:640;font-variant-numeric:tabular-nums}
.calnav{width:30px;height:30px;border-radius:9px;border:none;background:var(--fill);color:var(--label-2);cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .2s}
.calnav:hover{background:var(--fill-2)}.calnav:active{transform:scale(.9)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calgrid .wd{font-size:10.5px;color:var(--label-4);text-align:center;height:22px;display:grid;place-items:center;font-weight:520}
.calday{aspect-ratio:1;border:none;background:transparent;border-radius:10px;font-size:13px;color:var(--label-3);cursor:default;
  font-variant-numeric:tabular-nums;display:grid;place-items:center;position:relative;transition:transform .12s,background .18s}
.calday.has{color:var(--label);cursor:pointer;font-weight:560}
.calday.has:hover{background:var(--fill)}
.calday.has:active{transform:scale(.88)}
.calday.has::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.calday.sel{background:var(--blue);color:#fff;box-shadow:var(--shadow-s)}
.calday.sel::after{background:#fff}
.calday.empty{visibility:hidden}

.dayrow{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
.dayside{display:flex;flex-direction:column;align-items:center;gap:18px;width:168px}
.ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--a)*1deg),var(--fill) 0)}
.ring i{width:82px;height:82px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;box-shadow:inset 0 0 0 1px var(--sep)}
.ring b{font-size:32px;font-weight:720;letter-spacing:-.03em}
.daytype{display:flex;flex-direction:column;gap:7px;align-items:center}
.pill{font-size:12px;color:var(--label-2);background:var(--fill);padding:5px 12px;border-radius:100px;white-space:nowrap;font-weight:500}
.daygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.daycell{background:var(--fill);border-radius:15px;padding:12px 14px;transition:transform .14s cubic-bezier(.2,.7,.2,1),background .2s}
.daycell:hover{background:var(--fill-2);transform:translateY(-2px)}
.daycell .l{font-size:11.5px;color:var(--label-3);font-weight:500}
.daycell .v{font-size:19px;font-weight:640;margin-top:4px;letter-spacing:-.02em}
.daycell .v u{font-size:12px;font-weight:520;color:var(--label-3);text-decoration:none;margin-left:1px}
.daycell.flag{background:color-mix(in srgb,var(--muscle) 14%,transparent)}
.linkbtn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:13.5px;font-weight:560;padding:10px 16px;
  border-radius:13px;border:1px solid var(--sep);background:var(--fill);color:var(--label);text-decoration:none;
  transition:transform .12s cubic-bezier(.2,.7,.2,1),background .2s}
.linkbtn:hover{background:var(--fill-2)}
.linkbtn:active{transform:scale(.97)}

footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--sep);font-size:12px;color:var(--label-4);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

.ic{width:1em;height:1em;display:inline-block;vertical-align:-.125em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.daynav .ic,.calnav .ic{width:16px;height:16px}

/* ---------- reveal (spring-driven via JS; CSS fallback) ---------- */
.reveal{opacity:0}
.reveal.in{opacity:1}

/* ---------- accessibility: reduced motion / transparency / contrast ---------- */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{transition-duration:.001ms !important}
  .cscroll svg{transition:opacity .2s ease}
  .calpop{filter:none !important}
}
@media (prefers-reduced-transparency: reduce){
  .topbar,.calpop,.tip{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
  .yaxis{background:var(--card)}.raxis{background:var(--card)}
}
@media (prefers-contrast: more){
  :root{--sep:rgba(60,60,67,.5);--label-3:#4A4A4F}
  .card,.chip,.segmented{border:1px solid var(--sep-2)}
}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.dayrow{grid-template-columns:1fr;gap:22px}
  .dayside{flex-direction:row;width:auto;justify-content:flex-start}.daytype{align-items:flex-start}.daygrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.summary{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.daygrid{grid-template-columns:repeat(2,1fr)}.sec p{display:none}}
</style>
</head>

<body>
<div class="topbar" id="topbar">
  <div class="tbin">
    <div class="t">体成分趋势</div>
    <div class="g tnum" id="glance"></div>
  </div>
</div>

<div class="page">
  <header class="hero reveal">
    <div class="eyebrow">Body&nbsp;Composition</div>
    <h1>身体成分 · 趋势</h1>
    <div class="summary" id="summary"></div>
  </header>

  <section class="reveal">
    <div class="sec"><div><div class="e">Overview</div><h2>关键指标</h2></div>
      <p style="margin:0">绿色表示向更健康方向变化</p></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <section class="reveal">
    <div class="sec"><div><div class="e">Trend</div><h2>核心趋势</h2>
      <p>切换板块、多选指标叠加到同一折线；切换时曲线以弹簧动效平滑过渡，点上常驻数值。</p></div>
      <div class="segmented" id="boardTabs"></div></div>
    <div class="card pad">
      <div class="chips" id="metricChips"></div>
      <div class="toolbar"><span class="axhint" id="axHint"></span>
        <span class="hint"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3l7 17 2.5-7.5L20 10z"/></svg>点击折线上的点查看单日</span></div>
      <div class="charthost" id="trendChart"></div>
    </div>
  </section>

  <section class="reveal">
    <div class="sec"><div><div class="e">Segments</div><h2>节段每日趋势</h2>
      <p>五个身体部位随时间的脂肪 / 肌肉变化。</p></div>
      <div class="segmented" id="segTabs">
        <button class="on" data-seg="fat"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2.7l5.7 5.7a8 8 0 1 1-11.4 0z"/></svg>脂肪</button>
        <button data-seg="mus"><svg class="ic" viewBox="0 0 24 24"><path d="M6 8v8M4 9.5v5M18 8v8M20 9.5v5M6 12h12"/></svg>肌肉</button></div></div>
    <div class="card pad">
      <div class="charthost" id="segChart"></div>
      <div class="leg" id="segLegend"></div>
    </div>
  </section>

  <section class="reveal">
    <div class="sec"><div><div class="e">Daily</div><h2>单日视图</h2>
      <p>选择某一天，查看当日完整报告摘要。</p></div>
      <div class="daypick">
        <button class="daynav" id="dayPrev" title="上一天"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="daybtn" id="dayBtn"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span id="dayBtnLabel"></span><svg class="ic chev" viewBox="0 0 24 24" style="width:11px;height:11px"><polyline points="6 9 12 15 18 9"/></svg></button>
        <button class="daynav" id="dayNext" title="下一天"><svg class="ic" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
        <div class="calpop" id="calPop"></div>
      </div></div>
    <div class="card pad">
      <div class="dayrow">
        <div class="dayside">
          <div class="ring" id="scoreRing"><i><b class="tnum" id="scoreNum"></b></i></div>
          <div class="daytype" id="dayType"></div>
        </div>
        <div>
          <div class="daygrid" id="dayGrid"></div>
          <a id="reportLink" class="linkbtn" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>查看当日原始报告截图</a>
        </div>
      </div>
    </div>
  </section>

  <footer><span id="footL"></span><span class="tnum" id="footR"></span></footer>
</div>

/* ---------- tiny spring (critically damped default, velocity-carrying, re-targetable) ---------- */
class Spring{
  constructor(v,{response=0.4,damping=1}={}){this.v=v;this.x=v;this.vel=0;const w=2*Math.PI/response;this.k=w*w;this.c=2*damping*w;}
  to(t){this.x=t;}
  step(dt){dt=Math.min(dt,1/30);const a=-this.k*(this.v-this.x)-this.c*this.vel;this.vel+=a*dt;this.v+=this.vel*dt;return this.v;}
  get done(){return Math.abs(this.v-this.x)<0.05 && Math.abs(this.vel)<0.05;}
  snap(t){this.x=t;this.v=t;this.vel=0;}
}

/* ---------- spring count-up for a number node ---------- */
function countTo(node,target,dec,unit=''){
  if(RM){node.textContent=(+target).toFixed(dec)+unit;return;}
  const s=new Spring(parseFloat(node.dataset.v||target),{response:0.5});s.snap(parseFloat(node.dataset.v||target));s.to(target);
  let last=performance.now();
  (function loop(t){const dt=(t-last)/1000;last=t;const v=s.step(dt);node.textContent=v.toFixed(dec)+unit;node.dataset.v=v;
    if(!s.done)requestAnimationFrame(loop);else{node.textContent=(+target).toFixed(dec)+unit;node.dataset.v=target;}})(last);
}

/* ---------- KPI ---------- */
function spark(k,color){const v=arr(k),w=150,h=30,mn=Math.min(...v),mx=Math.max(...v),p=4;
 const X=i=>p+i*(w-2*p)/(v.length-1),Y=val=>h-p-(val-mn)/((mx-mn)||1)*(h-2*p);
 const s=el('svg',{viewBox:`0 0 ${w} ${h}`,preserveAspectRatio:'none',class:'spark'});s.style.width='100%';s.style.display='block';
 let d='';v.forEach((val,i)=>d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(val).toFixed(1)+' ');
 s.append(el('path',{d:d+`L${X(v.length-1)} ${h} L${X(0)} ${h} Z`,fill:color,opacity:.08}));
 s.append(el('path',{d,fill:'none',stroke:color,'stroke-width':1.8,'stroke-linejoin':'round','stroke-linecap':'round'}));
 s.append(el('circle',{cx:X(v.length-1),cy:Y(v[v.length-1]),r:2.4,fill:color}));return s;}
const kbox=document.getElementById('kpis');
['bf','weight','skM','fatM','vis','score'].forEach((k)=>{const m=M[k],v1=last[k],delta=+(v1-first[k]).toFixed(m.dec);

 const v=arr(k),mn=Math.min(...v),mx=Math.max(...v);
 const c=document.createElement('div');c.className='card stat';
 c.innerHTML=`<div class="lab"><span class="sw" style="background:${m.c}"></span>${m.name}</div>

 c.querySelector('.spark').appendChild(spark(k,m.c));kbox.appendChild(c);});

let chartCtx={};   // holds current geometry + spring state for #trendChart
function geom(host,series){
  const unitL=series[0].unit, unitR=(series.find(s=>s.unit!==unitL)||{}).unit, dual=unitR!==undefined;
  const yW=46, ryW=dual?50:0;
  const avail=Math.max(220,(host.getBoundingClientRect().width||700)-yW-ryW);
  const plotW=Math.max(avail,PAD_L+PAD_R+(N-1)*MIN_STEP), scrolls=plotW>avail+1;
  const X=i=>PAD_L+i*(plotW-PAD_L-PAD_R)/(N-1);
  const axisOf=s=>s.unit===unitL?0:1;
  const dom=[0,1].map(ax=>{let lo=1e9,hi=-1e9;series.forEach(s=>{if(axisOf(s)===ax)s.v.forEach(x=>{lo=Math.min(lo,x);hi=Math.max(hi,x);});});if(lo===1e9)return null;const p=(hi-lo)*0.22||1;return[lo-p,hi+p];});
  return {unitL,unitR,dual,yW,ryW,avail,plotW,scrolls,X,axisOf,dom};
}
function Y(val,dom){return T+(1-(val-dom[0])/(dom[1]-dom[0]))*(PLOT_H-T-B);}
function xLabelIdx(plotW){const step=(plotW-PAD_L-PAD_R)/(N-1);const xstep=Math.max(1,Math.ceil(64/step));
  const idx=[];for(let i=0;i<N;i+=xstep)idx.push(i);
  if(idx[idx.length-1]!==N-1){if(N-1-idx[idx.length-1]<xstep*0.6)idx.pop();idx.push(N-1);}return idx;}

// full (re)build of the chart DOM for #trendChart, given series; morph=true animates primary from previous
function buildTrend(series,{morph=false}={}){
  const host=document.getElementById('trendChart');
  const g=geom(host,series);
  const prev=chartCtx.series && chartCtx.g;
  // decide morph eligibility: single primary line, morph domain+points in pixel space
  const canMorph=morph && !RM && prev && chartCtx.g.plotW===g.plotW;
  host.innerHTML='';
  const box=document.createElement('div');box.className='cbox';
  const yw=document.createElement('div');yw.className='yaxis';yw.style.width=g.yW+'px';
  const yax=el('svg',{viewBox:`0 0 ${g.yW} ${PLOT_H}`,width:g.yW,height:PLOT_H});yw.appendChild(yax);
  let rw=null,rax=null;
  if(g.dual){rw=document.createElement('div');rw.className='raxis';rw.style.width=g.ryW+'px';
    rax=el('svg',{viewBox:`0 0 ${g.ryW} ${PLOT_H}`,width:g.ryW,height:PLOT_H});rw.appendChild(rax);}
  const scr=document.createElement('div');scr.className='cscroll';scr.style.marginLeft=g.yW+'px';if(g.dual)scr.style.marginRight=g.ryW+'px';
  const svg=el('svg',{viewBox:`0 0 ${g.plotW} ${PLOT_H}`,width:g.plotW,height:PLOT_H});scr.appendChild(svg);
  box.appendChild(yw);if(g.dual)box.appendChild(rw);box.appendChild(scr);host.appendChild(box);
  if(g.scrolls){const cue=document.createElement('div');cue.className='scrollcue';
    cue.innerHTML='<svg class="ic" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="7 8 3 12 7 16"/><polyline points="17 8 21 12 17 16"/></svg>左右拖动查看完整时间线';host.appendChild(cue);
    scr.scrollLeft=scr.scrollWidth;}

  // spring state for primary series (per-point y target in px, computed from a springing left-domain)
  const domL=g.dom[0];
  if(!canMorph){chartCtx.domSpring=[new Spring(domL[0]),new Spring(domL[1])];chartCtx.domSpring[0].snap(domL[0]);chartCtx.domSpring[1].snap(domL[1]);}
  else{chartCtx.domSpring[0].to(domL[0]);chartCtx.domSpring[1].to(domL[1]);}

  function paint(){
    const dLo=chartCtx.domSpring?chartCtx.domSpring[0].v:domL[0], dHi=chartCtx.domSpring?chartCtx.domSpring[1].v:domL[1];
    const dCur=[dLo,dHi];
    yax.innerHTML='';svg.innerHTML='';if(rax)rax.innerHTML='';
    // gridlines + left axis (from springing domain)
    for(let q=0;q<=4;q++){const yy=T+q*(PLOT_H-T-B)/4;
      svg.append(el('line',{x1:0,y1:yy,x2:g.plotW,y2:yy,stroke:'var(--sep)','stroke-width':q===4?1:.7}));
      const val=dHi-(q/4)*(dHi-dLo);yax.append(txt(g.yW-8,yy+3,val.toFixed((dHi-dLo)<6?1:0),{anchor:'end',size:10,fill:'var(--label-4)'}));}
    if(g.dual){const rc=series.find(s=>g.axisOf(s)===1).c;const rd=g.dom[1];
      for(let q=0;q<=4;q++){const yy=T+q*(PLOT_H-T-B)/4;const val=rd[1]-(q/4)*(rd[1]-rd[0]);rax.append(txt(8,yy+3,val.toFixed(1),{anchor:'start',size:10,fill:rc}));}}
    // x labels (anti-overlap)
    xLabelIdx(g.plotW).forEach(i=>svg.append(txt(g.X(i),PLOT_H-11,sd(DATA[i].date),{anchor:'middle',size:10,fill:'var(--label-4)'})));
    // series
    series.forEach((s,si)=>{const ax=g.axisOf(s), useDom=ax===0?dCur:g.dom[1];
      let d='';s.v.forEach((val,i)=>d+=(i?'L':'M')+g.X(i).toFixed(1)+' '+Y(val,useDom).toFixed(1)+' ');
      if(si===0){const gid='grad';const lg=el('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1});
        lg.append(el('stop',{offset:'0%','stop-color':s.c,'stop-opacity':.16}),el('stop',{offset:'100%','stop-color':s.c,'stop-opacity':0}));svg.append(lg);
        svg.append(el('path',{d:d+`L${g.X(N-1)} ${PLOT_H-B} L${g.X(0)} ${PLOT_H-B} Z`,fill:`url(#${gid})`}));}
      svg.append(el('path',{d,fill:'none',stroke:s.c,'stroke-width':si===0?2.6:1.9,'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':si===0?'none':'5 4'}));
      s.v.forEach((val,i)=>svg.append(el('circle',{cx:g.X(i),cy:Y(val,useDom),r:si===0?2.4:1.9,fill:'var(--card)',stroke:s.c,'stroke-width':1.4})));
    });
    // persistent labels on primary
    const p=series[0],lab=Math.max(1,Math.round(N/12)),dec=M[p.key]?M[p.key].dec:1;
    p.v.forEach((val,i)=>{if(i%lab===0||i===N-1||i===selDay)svg.append(txt(g.X(i),Y(val,dCur)-9,(+val).toFixed(dec),{anchor:'middle',size:9.5,fill:p.c,weight:640}));});
    // selected-day marker
    svg.append(el('line',{x1:g.X(selDay),y1:T,x2:g.X(selDay),y2:PLOT_H-B,stroke:series[0].c,'stroke-width':1,opacity:.35,'stroke-dasharray':'3 3'}));
    // hover hit
    const hl=el('line',{x1:0,y1:T,x2:0,y2:PLOT_H-B,stroke:'var(--label-3)','stroke-width':1,opacity:0});svg.append(hl);
    const hit=el('rect',{x:0,y:T,width:g.plotW,height:PLOT_H-T-B,fill:'transparent',style:'cursor:pointer'});svg.append(hit);
    chartCtx._svg=svg;chartCtx._hl=hl;chartCtx._g=g;chartCtx._series=series;
  }
  paint();
  // interactions (bound once per build via svg ref)
  const idxAt=ev=>{const r=chartCtx._svg.getBoundingClientRect();const sx=(ev.clientX-r.left)/r.width*g.plotW;let i=Math.round((sx-PAD_L)/((g.plotW-PAD_L-PAD_R)/(N-1)));return Math.max(0,Math.min(N-1,i));};
  scr.addEventListener('mousemove',ev=>{const i=idxAt(ev);chartCtx._hl.setAttribute('x1',g.X(i));chartCtx._hl.setAttribute('x2',g.X(i));chartCtx._hl.setAttribute('opacity',.4);
    let html=`<b>${DATA[i].date.slice(5)} ${DATA[i].wk||''}</b>`;series.forEach(s=>html+=`<br><span style="color:${s.c}">●</span> ${s.name} <b>${s.v[i]}${s.unit||''}</b>`);
    tip.innerHTML=html;tip.style.opacity=1;tip.style.left=Math.min(ev.clientX+14,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.max(8,ev.clientY-12)+'px';});
  scr.addEventListener('mouseleave',()=>{tip.style.opacity=0;if(chartCtx._hl)chartCtx._hl.setAttribute('opacity',0);});
  scr.addEventListener('click',ev=>{selDay=idxAt(ev);syncDay();});

  chartCtx.g=g;chartCtx.series=series;chartCtx.paint=paint;
  host._axHint=`左轴 · ${g.unitL||'—'}`+(g.dual?`　右轴 · ${g.unitR||'—'}`:'');
  document.getElementById('axHint').textContent=host._axHint;
  // run morph loop if animating domain
  if(canMorph){startMorph();}
}
let morphRAF=0,morphLast=0;
function startMorph(){cancelAnimationFrame(morphRAF);morphLast=performance.now();
  (function loop(t){const dt=(t-morphLast)/1000;morphLast=t;
    chartCtx.domSpring[0].step(dt);chartCtx.domSpring[1].step(dt);
    if(chartCtx.paint)chartCtx.paint();
    if(!(chartCtx.domSpring[0].done&&chartCtx.domSpring[1].done))morphRAF=requestAnimationFrame(loop);
  })(morphLast);
}

/* ---------- boards + multi-select ---------- */
const BOARDS={
 core:{label:'核心',metrics:['bf','weight','skM','score'],def:['bf']},
 mass:{label:'重量',metrics:['weight','fatM','ffm','musM','skM','watM','proM','bonM'],def:['fatM','ffm']},
 ratio:{label:'比例',metrics:['bf','musP','watP','proP','bonP'],def:['bf','musP']},
 meta:{label:'代谢评分',metrics:['bmr','rec','score','bage','vis','smi'],def:['score']},
};
let board='core',sel=[...BOARDS.core.def];
const boardTabs=document.getElementById('boardTabs');
Object.entries(BOARDS).forEach(([k,b])=>{const btn=document.createElement('button');btn.textContent=b.label;if(k===board)btn.classList.add('on');
 btn.onclick=()=>{board=k;sel=[...b.def];[...boardTabs.children].forEach(x=>x.classList.remove('on'));btn.classList.add('on');renderChips();drawTrend(true);};boardTabs.appendChild(btn);});
const distinctUnits=keys=>[...new Set(keys.map(k=>M[k].unit))];
function renderChips(){const box=document.getElementById('metricChips');box.innerHTML='';
 BOARDS[board].metrics.forEach(k=>{const m=M[k],on=sel.includes(k),blocked=!on && distinctUnits([...sel,k]).length>2;
   const b=document.createElement('button');b.className='chip'+(on?' on':'');b.disabled=blocked;if(on)b.style.background=m.c;
   b.innerHTML=`<span class="sw" style="${on?'':'color:'+m.c}"></span>${m.name}<span class="u">${m.unit||''}</span>`;
   b.onclick=()=>{if(on){if(sel.length>1)sel=sel.filter(x=>x!==k);}else{if(distinctUnits([...sel,k]).length<=2)sel=[...sel,k];}renderChips();drawTrend(true);};
   box.appendChild(b);});}
function seriesFromSel(){return sel.map(k=>({key:k,name:M[k].name,unit:M[k].unit,v:arr(k),c:M[k].c}));}
function drawTrend(morph){
  const s=seriesFromSel();
  // morph only when it's a single primary line vs previous single (pixel-domain morph); else cross-fade
  const singleNow=s.length>=1;
  const prevPlotOK=chartCtx.g && (geom(document.getElementById('trendChart'),s).plotW===chartCtx.g.plotW);
  if(morph && !RM && chartCtx.series && prevPlotOK && s.length===1 && chartCtx.series.length===1){
    buildTrend(s,{morph:true});
  }else if(morph && !RM && chartCtx.series){
    // cross-fade
    const old=chartCtx._svg;if(old)old.style.opacity=0;
    setTimeout(()=>buildTrend(s,{morph:false}),140);
  }else{buildTrend(s,{morph:false});}
}
renderChips();buildTrend(seriesFromSel(),{morph:false});

/* ---------- segmental daily trend (own simpler chart, no morph) ---------- */
let segKind='fat';
const SEGP=[['左臂','LA','var(--fat)'],['右臂','RA','#E58A5C'],['躯干','Tr','var(--blue)'],['左腿','LL','var(--plum)'],['右腿','RL','var(--moss)']];
function buildSeg(){
  const host=document.getElementById('segChart');const pre=segKind==='fat'?'f':'m';
  const series=SEGP.map(p=>({key:null,name:p[0],unit:'kg',v:arr(pre+p[1]),c:p[2]}));
  const g=geom(host,series);host.innerHTML='';
  const box=document.createElement('div');box.className='cbox';
  const yw=document.createElement('div');yw.className='yaxis';yw.style.width=g.yW+'px';
  const yax=el('svg',{viewBox:`0 0 ${g.yW} ${PLOT_H}`,width:g.yW,height:PLOT_H});yw.appendChild(yax);
  const scr=document.createElement('div');scr.className='cscroll';scr.style.marginLeft=g.yW+'px';
  const svg=el('svg',{viewBox:`0 0 ${g.plotW} ${PLOT_H}`,width:g.plotW,height:PLOT_H});scr.appendChild(svg);
  box.appendChild(yw);box.appendChild(scr);host.appendChild(box);
  if(g.scrolls){const cue=document.createElement('div');cue.className='scrollcue';
    cue.innerHTML='<svg class="ic" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="7 8 3 12 7 16"/><polyline points="17 8 21 12 17 16"/></svg>左右拖动查看完整时间线';host.appendChild(cue);scr.scrollLeft=scr.scrollWidth;}
  const dom=g.dom[0];
  for(let q=0;q<=4;q++){const yy=T+q*(PLOT_H-T-B)/4;svg.append(el('line',{x1:0,y1:yy,x2:g.plotW,y2:yy,stroke:'var(--sep)','stroke-width':q===4?1:.7}));
    const val=dom[1]-(q/4)*(dom[1]-dom[0]);yax.append(txt(g.yW-8,yy+3,val.toFixed(1),{anchor:'end',size:10,fill:'var(--label-4)'}));}
  xLabelIdx(g.plotW).forEach(i=>svg.append(txt(g.X(i),PLOT_H-11,sd(DATA[i].date),{anchor:'middle',size:10,fill:'var(--label-4)'})));
  series.forEach(s=>{let d='';s.v.forEach((val,i)=>d+=(i?'L':'M')+g.X(i).toFixed(1)+' '+Y(val,dom).toFixed(1)+' ');
    svg.append(el('path',{d,fill:'none',stroke:s.c,'stroke-width':2.1,'stroke-linejoin':'round','stroke-linecap':'round'}));
    s.v.forEach((val,i)=>svg.append(el('circle',{cx:g.X(i),cy:Y(val,dom),r:1.9,fill:'var(--card)',stroke:s.c,'stroke-width':1.3})));});
  svg.append(el('line',{x1:g.X(selDay),y1:T,x2:g.X(selDay),y2:PLOT_H-B,stroke:'var(--label-3)','stroke-width':1,opacity:.28,'stroke-dasharray':'3 3'}));
  const hl=el('line',{x1:0,y1:T,x2:0,y2:PLOT_H-B,stroke:'var(--label-3)','stroke-width':1,opacity:0});svg.append(hl);
  const hit=el('rect',{x:0,y:T,width:g.plotW,height:PLOT_H-T-B,fill:'transparent',style:'cursor:pointer'});svg.append(hit);
  const idxAt=ev=>{const r=svg.getBoundingClientRect();const sx=(ev.clientX-r.left)/r.width*g.plotW;let i=Math.round((sx-PAD_L)/((g.plotW-PAD_L-PAD_R)/(N-1)));return Math.max(0,Math.min(N-1,i));};
  scr.addEventListener('mousemove',ev=>{const i=idxAt(ev);hl.setAttribute('x1',g.X(i));hl.setAttribute('x2',g.X(i));hl.setAttribute('opacity',.4);
    let html=`<b>${DATA[i].date.slice(5)} ${DATA[i].wk||''} · ${segKind==='fat'?'脂肪':'肌肉'}</b>`;series.forEach(s=>html+=`<br><span style="color:${s.c}">●</span> ${s.name} <b>${s.v[i]}kg</b>`);
    tip.innerHTML=html;tip.style.opacity=1;tip.style.left=Math.min(ev.clientX+14,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.max(8,ev.clientY-12)+'px';});
  scr.addEventListener('mouseleave',()=>{tip.style.opacity=0;hl.setAttribute('opacity',0);});
  scr.addEventListener('click',ev=>{selDay=idxAt(ev);syncDay();});
  document.getElementById('segLegend').innerHTML=series.map(s=>`<span><i style="background:${s.c}"></i>${s.name}</span>`).join('');
}
document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-seg]').forEach(x=>x.classList.remove('on'));b.classList.add('on');segKind=b.dataset.seg;
  const host=document.getElementById('segChart').querySelector('.cscroll svg');if(host&&!RM){host.style.opacity=0;setTimeout(buildSeg,140);}else buildSeg();});
buildSeg();

/* ---------- single-day view with materializing calendar ---------- */
const dateIndex=new Map(DATA.map((d,i)=>[d.date,i]));
const pad2=n=>String(n).padStart(2,'0');
const dayBtn=document.getElementById('dayBtn'),dayBtnLabel=document.getElementById('dayBtnLabel'),calPop=document.getElementById('calPop');
const dayPrev=document.getElementById('dayPrev'),dayNext=document.getElementById('dayNext');
let viewY,viewM,calOpen=false;
function reportFile(d){return "#";}
function syncDay(){renderDay();drawTrend(false);buildSeg();if(calOpen)renderCal();}
dayPrev.onclick=()=>{if(selDay>0){selDay--;syncDay();}};
dayNext.onclick=()=>{if(selDay<N-1){selDay++;syncDay();}};
dayBtn.onclick=e=>{e.stopPropagation();calOpen=!calOpen;if(calOpen){const[y,m]=DATA[selDay].date.split('-').map(Number);viewY=y;viewM=m;renderCal();}calPop.classList.toggle('show',calOpen);};
document.addEventListener('click',e=>{if(calOpen&&!calPop.contains(e.target)&&!dayBtn.contains(e.target)){calOpen=false;calPop.classList.remove('show');}});
function renderCal(){
 const wd=['一','二','三','四','五','六','日'];
 const firstDow=(new Date(viewY,viewM-1,1).getDay()+6)%7, days=new Date(viewY,viewM,0).getDate();
 let html=`<div class="calhead"><button class="calnav" id="calPrev"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>`+
   `<span class="m tnum">${viewY}年${viewM}月</span>`+
   `<button class="calnav" id="calNext"><svg class="ic" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button></div><div class="calgrid">`;
 html+=wd.map(w=>`<div class="wd">${w}</div>`).join('');
 for(let i=0;i<firstDow;i++)html+=`<div class="calday empty"></div>`;
 for(let day=1;day<=days;day++){const ds=`${viewY}-${pad2(viewM)}-${pad2(day)}`,has=dateIndex.has(ds),sel2=has&&dateIndex.get(ds)===selDay;
   html+=`<button class="calday${has?' has':''}${sel2?' sel':''}" ${has?`data-d="${ds}"`:'disabled'}>${day}</button>`;}
 html+='</div>';calPop.innerHTML=html;
 calPop.querySelector('#calPrev').onclick=ev=>{ev.stopPropagation();viewM--;if(viewM<1){viewM=12;viewY--;}renderCal();};
 calPop.querySelector('#calNext').onclick=ev=>{ev.stopPropagation();viewM++;if(viewM>12){viewM=1;viewY++;}renderCal();};
 calPop.querySelectorAll('.calday.has').forEach(b=>b.onclick=ev=>{ev.stopPropagation();selDay=dateIndex.get(b.dataset.d);calOpen=false;calPop.classList.remove('show');syncDay();});
}
function renderDay(){const d=DATA[selDay];
 dayBtnLabel.textContent=`${d.date} ${d.wk||''}`;dayPrev.disabled=selDay<=0;dayNext.disabled=selDay>=N-1;
 const ring=document.getElementById('scoreRing');
 if(RM){ring.style.setProperty('--a',d.score*3.6);}else{
   const s=new Spring(parseFloat(ring.dataset.a||d.score),{response:0.5});s.snap(parseFloat(ring.dataset.a||d.score));s.to(d.score);let lt=performance.now();
   (function lp(t){const dt=(t-lt)/1000;lt=t;const v=s.step(dt);ring.style.setProperty('--a',v*3.6);ring.dataset.a=v;if(!s.done)requestAnimationFrame(lp);else{ring.style.setProperty('--a',d.score*3.6);ring.dataset.a=d.score;}})(lt);}
 countTo(document.getElementById('scoreNum'),d.score,0);
 const cells=[['体重',d.weight,'kg'],['体脂率',d.bf,'%'],['脂肪量',d.fatM,'kg'],['肌肉量',d.musM,'kg'],['骨骼肌量',d.skM,'kg'],['去脂体重',d.ffm,'kg'],['身体水分',d.watP,'%'],['蛋白质率',d.proP,'%'],['骨盐量',d.bonM,'kg'],['内脏脂肪',d.vis,'级'],['基础代谢',d.bmr,'kcal'],['骨骼肌指数',d.smi,'']];
 document.getElementById('dayGrid').innerHTML=cells.map(([l,v,u])=>`<div class="daycell${l==='内脏脂肪'&&v<=4?' flag':''}"><div class="l">${l}</div><div class="v tnum">${v}<u>${u}</u></div></div>`).join('');
 document.getElementById('dayType').innerHTML=[['日期',`${d.date.slice(5)} ${d.wk||''}`],['身体形态',d.shape],['身体类型',d.type],['身体年龄',d.bage+'岁']].map(([l,v])=>`<span class="pill">${l} · ${v}</span>`).join('');
 document.getElementById('reportLink').href=reportFile(d);}
renderDay();

/* ---------- KPI count-up + reveal on load (staggered spring) ---------- */
document.querySelectorAll('.knum').forEach(n=>countTo(n,+n.dataset.t,+n.dataset.d));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){revealSpring(e.target);io.unobserve(e.target);}}),{threshold:.05});
document.querySelectorAll('.reveal').forEach((x,i)=>{x.dataset.i=i;io.observe(x);});
function revealSpring(node){
  if(RM){node.classList.add('in');node.style.opacity='';return;}
  node.classList.add('in');
  const s=new Spring(16,{response:0.55,damping:0.9});s.snap(16);s.to(0);let lt=performance.now(),op=0;
  (function lp(t){const dt=(t-lt)/1000;lt=t;const y=s.step(dt);op=Math.min(1,1-y/16);node.style.transform=`translateY(${y.toFixed(2)}px)`;node.style.opacity=op.toFixed(2);
    if(!s.done)requestAnimationFrame(lp);else{node.style.transform='';node.style.opacity='';}})(lt);
}

/* ---------- responsive redraw (debounced) ---------- */
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{buildTrend(seriesFromSel(),{morph:false});buildSeg();},160);});
</script>
